name: Docker

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image_name }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_tag: amd64
            runner: ubuntu-24.04
            image_name: opentk-api
            docker_target: api
          - platform: linux/arm64
            platform_tag: arm64
            runner: ubuntu-24.04-arm
            image_name: opentk-api
            docker_target: api
          - platform: linux/amd64
            platform_tag: amd64
            runner: ubuntu-24.04
            image_name: opentk-sync
            docker_target: sync
          - platform: linux/arm64
            platform_tag: arm64
            runner: ubuntu-24.04-arm
            image_name: opentk-sync
            docker_target: sync
          - platform: linux/amd64
            platform_tag: amd64
            runner: ubuntu-24.04
            image_name: opentk-search-reconciler
            docker_target: search-reconciler
          - platform: linux/arm64
            platform_tag: arm64
            runner: ubuntu-24.04-arm
            image_name: opentk-search-reconciler
            docker_target: search-reconciler
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Set image name
        id: image
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${{ matrix.image_name }}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore cache-mount directories
        uses: actions/cache@v5.0.5
        id: cache-mount
        with:
          path: buildkit-cache-mounts/${{ matrix.image_name }}-${{ matrix.platform_tag }}
          key: buildkit-cache-mounts-${{ matrix.image_name }}-${{ matrix.platform_tag }}-${{ hashFiles('docker/Dockerfile', 'Cargo.lock') }}
          restore-keys: |
            buildkit-cache-mounts-${{ matrix.image_name }}-${{ matrix.platform_tag }}-

      - name: Inject cache-mount directories into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.3.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.cache-mount.outputs.cache-hit }}
          cache-map: |
            {
              "buildkit-cache-mounts/${{ matrix.image_name }}-${{ matrix.platform_tag }}/var-cache-apt": "/var/cache/apt",
              "buildkit-cache-mounts/${{ matrix.image_name }}-${{ matrix.platform_tag }}/var-lib-apt-lists": "/var/lib/apt/lists",
              "buildkit-cache-mounts/${{ matrix.image_name }}-${{ matrix.platform_tag }}/cargo-registry": "/usr/local/cargo/registry",
              "buildkit-cache-mounts/${{ matrix.image_name }}-${{ matrix.platform_tag }}/cargo-git": "/usr/local/cargo/git",
              "buildkit-cache-mounts/${{ matrix.image_name }}-${{ matrix.platform_tag }}/cargo-install-target": "/usr/local/cargo-install-target",
              "buildkit-cache-mounts/${{ matrix.image_name }}-${{ matrix.platform_tag }}/src-target": "/src/target"
            }

      - name: Build ${{ matrix.image_name }} ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.docker_target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image_name }}-${{ matrix.platform_tag }}
          cache-to: type=gha,scope=${{ matrix.image_name }}-${{ matrix.platform_tag }},mode=max

      - name: Verify cache-backed rebuild is incremental
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.docker_target }}
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image_name }}-${{ matrix.platform_tag }}
          cache-to: type=gha,scope=${{ matrix.image_name }}-${{ matrix.platform_tag }},mode=max

      - name: Export ${{ matrix.image_name }} ${{ matrix.platform }} digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected image digest: ${digest}" >&2
            exit 1
          fi

          mkdir -p "/tmp/digests/${{ matrix.image_name }}"
          touch "/tmp/digests/${{ matrix.image_name }}/${digest#sha256:}"

      - name: Upload ${{ matrix.image_name }} ${{ matrix.platform }} digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.image_name }}-${{ matrix.platform_tag }}-digest
          path: /tmp/digests/${{ matrix.image_name }}/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GHCR manifests
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download opentk-api amd64 digest
        uses: actions/download-artifact@v8.0.1
        with:
          name: opentk-api-amd64-digest
          path: /tmp/digests/opentk-api-amd64

      - name: Download opentk-api arm64 digest
        uses: actions/download-artifact@v8.0.1
        with:
          name: opentk-api-arm64-digest
          path: /tmp/digests/opentk-api-arm64

      - name: Download opentk-sync amd64 digest
        uses: actions/download-artifact@v8.0.1
        with:
          name: opentk-sync-amd64-digest
          path: /tmp/digests/opentk-sync-amd64

      - name: Download opentk-sync arm64 digest
        uses: actions/download-artifact@v8.0.1
        with:
          name: opentk-sync-arm64-digest
          path: /tmp/digests/opentk-sync-arm64

      - name: Download opentk-search-reconciler amd64 digest
        uses: actions/download-artifact@v8.0.1
        with:
          name: opentk-search-reconciler-amd64-digest
          path: /tmp/digests/opentk-search-reconciler-amd64

      - name: Download opentk-search-reconciler arm64 digest
        uses: actions/download-artifact@v8.0.1
        with:
          name: opentk-search-reconciler-arm64-digest
          path: /tmp/digests/opentk-search-reconciler-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit-SHA multiplatform tags
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_SHA}"

          for image_name in opentk-api opentk-sync opentk-search-reconciler; do
            image="ghcr.io/${owner}/${image_name}"
            refs=()

            for platform_tag in amd64 arm64; do
              digest_dir="/tmp/digests/${image_name}-${platform_tag}"
              digest_count="$(find "${digest_dir}" -maxdepth 1 -type f | wc -l)"
              if [[ "${digest_count}" -ne 1 ]]; then
                echo "Expected exactly one digest artifact in ${digest_dir}, found ${digest_count}" >&2
                find "${digest_dir}" -maxdepth 1 -type f -print >&2
                exit 1
              fi

              digest="$(find "${digest_dir}" -maxdepth 1 -type f -printf '%f\n')"
              refs+=("${image}@sha256:${digest}")
            done

            docker buildx imagetools create --tag "${image}:${tag}" "${refs[@]}"

            docker buildx imagetools inspect "${image}:${tag}"
          done
