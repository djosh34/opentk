name: Docker

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: opentk

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_tag: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_tag: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore cache-mount directories
        uses: actions/cache@v4
        id: cache-mount
        with:
          path: buildkit-cache-mounts/${{ matrix.platform_tag }}
          key: buildkit-cache-mounts-${{ matrix.platform_tag }}-${{ hashFiles('docker/Dockerfile', 'Cargo.lock') }}
          restore-keys: |
            buildkit-cache-mounts-${{ matrix.platform_tag }}-

      - name: Inject cache-mount directories into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.cache-mount.outputs.cache-hit }}
          cache-map: |
            {
              "buildkit-cache-mounts/${{ matrix.platform_tag }}/var-cache-apt": "/var/cache/apt",
              "buildkit-cache-mounts/${{ matrix.platform_tag }}/var-lib-apt-lists": "/var/lib/apt/lists",
              "buildkit-cache-mounts/${{ matrix.platform_tag }}/cargo-registry": "/usr/local/cargo/registry",
              "buildkit-cache-mounts/${{ matrix.platform_tag }}/cargo-git": "/usr/local/cargo/git",
              "buildkit-cache-mounts/${{ matrix.platform_tag }}/cargo-install-target": "/usr/local/cargo-install-target",
              "buildkit-cache-mounts/${{ matrix.platform_tag }}/src-target": "/src/target"
            }

      - name: Build ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=/tmp/opentk-${{ matrix.platform_tag }}.oci.tar
          provenance: false
          cache-from: type=gha,scope=opentk-${{ matrix.platform_tag }}
          cache-to: type=gha,scope=opentk-${{ matrix.platform_tag }},mode=max

      - name: Verify cache-backed rebuild is incremental
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          provenance: false
          cache-from: type=gha,scope=opentk-${{ matrix.platform_tag }}
          cache-to: type=gha,scope=opentk-${{ matrix.platform_tag }},mode=max

      - name: Upload ${{ matrix.platform }} OCI archive
        uses: actions/upload-artifact@v4
        with:
          name: opentk-${{ matrix.platform_tag }}-oci
          path: /tmp/opentk-${{ matrix.platform_tag }}.oci.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GHCR manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Download amd64 image
        uses: actions/download-artifact@v4
        with:
          name: opentk-amd64-oci
          path: /tmp/opentk-amd64

      - name: Download arm64 image
        uses: actions/download-artifact@v4
        with:
          name: opentk-arm64-oci
          path: /tmp/opentk-arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OCI tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Publish one commit-SHA multiplatform tag
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          tag="${GITHUB_SHA}"

          skopeo copy --all \
            "oci-archive:/tmp/opentk-amd64/opentk-amd64.oci.tar" \
            "docker://localhost:5000/${IMAGE_NAME}:${tag}-amd64"
          skopeo copy --all \
            "oci-archive:/tmp/opentk-arm64/opentk-arm64.oci.tar" \
            "docker://localhost:5000/${IMAGE_NAME}:${tag}-arm64"

          docker buildx imagetools create \
            --tag "${image}:${tag}" \
            "localhost:5000/${IMAGE_NAME}:${tag}-amd64" \
            "localhost:5000/${IMAGE_NAME}:${tag}-arm64"

          docker buildx imagetools inspect "${image}:${tag}"
