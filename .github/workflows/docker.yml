name: Docker

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-dependency-cache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Warm scratch dependency cache
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --target built-dependency-cache \
            --cache-from "type=gha,scope=opentk-scratch-deps" \
            --cache-to "type=gha,scope=opentk-scratch-deps,mode=max" \
            -f docker/Dockerfile.scratch-artifacts \
            --output "type=oci,dest=/tmp/opentk-scratch-deps.oci.tar" \
            .
      - name: Upload scratch dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentk-scratch-deps-oci
          path: /tmp/opentk-scratch-deps.oci.tar
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    needs:
      - warm-dependency-cache
    permissions:
      contents: read
    strategy:
      matrix:
        binary:
          - opentk-sync
          - opentk-api
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Download scratch dependency artifact
        uses: actions/download-artifact@v4
        with:
          name: opentk-scratch-deps-oci
          path: /tmp/opentk-scratch-deps
      - name: Unpack scratch dependency artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/opentk-scratch-deps-oci-layout
          tar -xf /tmp/opentk-scratch-deps/opentk-scratch-deps.oci.tar -C /tmp/opentk-scratch-deps-oci-layout
      - name: Build cross-compiled scratch artifacts
        run: |
          set -euo pipefail
          artifact_image="localhost:5000/opentk-scratch-artifacts-${{ matrix.binary }}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --build-context dependency-cache-context=oci-layout:///tmp/opentk-scratch-deps-oci-layout \
            --cache-from "type=gha,scope=opentk-scratch-deps" \
            --cache-from "type=gha,scope=opentk-scratch-artifacts-${{ matrix.binary }}" \
            --cache-to "type=gha,scope=opentk-scratch-artifacts-${{ matrix.binary }},mode=max" \
            --build-arg "BINARY=${{ matrix.binary }}" \
            -f docker/Dockerfile.scratch-artifacts \
            -t "${artifact_image}" \
            --push \
            .
      - name: Assemble scratch image artifacts
        run: |
          set -euo pipefail
          artifact_image="localhost:5000/opentk-scratch-artifacts-${{ matrix.binary }}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from "type=gha,scope=opentk-scratch-${{ matrix.binary }}" \
            --cache-to "type=gha,scope=opentk-scratch-${{ matrix.binary }},mode=max" \
            --metadata-file "/tmp/${{ matrix.binary }}.metadata.json" \
            --build-arg "BINARY=${{ matrix.binary }}" \
            --build-arg "ARTIFACT_IMAGE=${artifact_image}" \
            -f docker/Dockerfile.scratch \
            --output "type=oci,dest=/tmp/${{ matrix.binary }}.oci.tar" \
            .
      - name: Upload scratch image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-oci-archive
          path: |
            /tmp/${{ matrix.binary }}.oci.tar
            /tmp/${{ matrix.binary }}.metadata.json
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download opentk-sync image artifact
        uses: actions/download-artifact@v4
        with:
          name: opentk-sync-oci-archive
      - name: Download opentk-api image artifact
        uses: actions/download-artifact@v4
        with:
          name: opentk-api-oci-archive
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install OCI publication tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Publish GHCR image tags
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          tags=()
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags=("latest" "sha-${short_sha}")
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags=("${GITHUB_REF_NAME}")
          else
            echo "ref ${GITHUB_REF} does not publish tags"
            exit 0
          fi

          for binary in opentk-sync opentk-api; do
            for tag in "${tags[@]}"; do
              skopeo copy --all \
                --authfile "${HOME}/.docker/config.json" \
                "oci-archive:${binary}.oci.tar" \
                "docker://ghcr.io/${owner}/${binary}:${tag}"
            done
          done
