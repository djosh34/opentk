[workspace]
members = [
    "crates/opentk-api",
    "crates/opentk-core",
    "crates/opentk-db",
    "crates/opentk-sync",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/joshazimullah/opentk"

[workspace.dependencies]
axum = "0.8.1"
clap = { version = "4.5.26", features = ["derive"] }
opentk-core = { path = "crates/opentk-core" }
quick-xml = "0.37.2"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sqlx = { version = "0.8.3", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
