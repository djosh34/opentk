[workspace]
members = [
    "crates/opentk-api",
    "crates/opentk-core",
    "crates/opentk-db",
    "crates/opentk-search",
    "crates/opentk-search-eval",
    "crates/opentk-sync",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/joshazimullah/opentk"

[workspace.dependencies]
axum = "0.8.1"
chrono = { version = "0.4.39", default-features = false, features = ["clock"] }
clap = { version = "4.5.26", features = ["derive", "env"] }
opentk-core = { path = "crates/opentk-core" }
opentk-db = { path = "crates/opentk-db" }
opentk-search = { path = "crates/opentk-search" }
opentk-sync = { path = "crates/opentk-sync" }
quick-xml = "0.37.2"
pdf-extract = "0.10.0"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20.0"
scraper = "0.26.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
utoipa = "5.4.0"
uuid = { version = "1.12.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
