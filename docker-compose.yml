services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: opentk
      POSTGRES_USER: opentk
      POSTGRES_PASSWORD: opentk
    ports:
      - "5432:5432"
    volumes:
      - opentk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentk -d opentk"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - opentk

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - opentk-meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - opentk

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: always
    command: ["--config", "/etc/opentk/config.toml"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./config/opentk.compose.toml:/etc/opentk/config.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - opentk

  sync:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sync
    restart: unless-stopped
    command: ["--config", "/etc/opentk/config.toml", "poll"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/opentk.compose.toml:/etc/opentk/config.toml:ro
    healthcheck:
      test: ["CMD", "/bin/opentk-sync", "--config", "/etc/opentk/config.toml", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - opentk

  search-reconciler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: search-reconciler
    restart: unless-stopped
    command: ["--config", "/etc/opentk/config.toml", "run"]
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./config/opentk.compose.toml:/etc/opentk/config.toml:ro
    healthcheck:
      test:
        [
          "CMD",
          "/bin/opentk-search-reconciler",
          "--config",
          "/etc/opentk/config.toml",
          "--health-check",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - opentk

networks:
  opentk:
    name: opentk
    ipam:
      config:
        - subnet: 10.88.0.0/24

volumes:
  opentk-postgres-data:
  opentk-meilisearch-data:
